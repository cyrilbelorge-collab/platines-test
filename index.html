<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Test audio</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; color: #fff; font-family: sans-serif; overflow: hidden; }
  #cadre { padding: 4vh 5vw; }
  h1 { font-size: 5vh; margin: 0 0 2vh; color: #8e95a8; font-weight: normal; }
  #consigne { font-size: 5.2vh; color: #ffd166; margin-bottom: 3vh; min-height: 13vh; font-weight: bold; }
  #code { font-size: 9vh; font-weight: bold; margin: 2vh 0; color: #8fd18b; }
  #journal { font-size: 2.4vh; color: #cfd6e4; white-space: pre-wrap; line-height: 1.5; }
</style>
</head>
<body>
<div id="cadre">
  <h1>Test audio (35 secondes)</h1>
  <div id="consigne">Chargement…</div>
  <div id="code"></div>
  <div id="journal"></div>
</div>
<script>
var journal = document.getElementById("journal");
var consigne = document.getElementById("consigne");
function rapport(cle, valeur) { journal.textContent += cle + " : " + valeur + "\n"; }
window.onerror = function (m, f, l) { rapport("ERREUR", m + " ligne " + l); };

var moteur = (navigator.userAgent.match(/(Chrome|Chromium|WPE|QtWebEngine|Version|AppleWebKit)\/[\d.]+/g) || ["inconnu"]).join(" ");
rapport("moteur", moteur);
var Contexte = window.AudioContext || window.webkitAudioContext;
var essai = document.createElement("audio");
var mp3 = essai.canPlayType ? essai.canPlayType("audio/mpeg") : "";
rapport("formats", "mp3 " + (mp3 || "non") + " | aac " + (essai.canPlayType ? essai.canPlayType("audio/mp4") || "non" : "?")
        + " | flac " + (essai.canPlayType ? essai.canPlayType("audio/flac") || "non" : "?"));

var ctx = null, gGrave = null, gAigu = null;
function sonsFabriques() {
    if (!Contexte) return;
    try {
        if (!ctx) {
            ctx = new Contexte();
            var grave = ctx.createOscillator(); gGrave = ctx.createGain();
            grave.type = "sawtooth"; grave.frequency.value = 82; gGrave.gain.value = 0.2;
            grave.connect(gGrave); gGrave.connect(ctx.destination); grave.start();
            var aigu = ctx.createOscillator(); gAigu = ctx.createGain();
            aigu.type = "square"; aigu.frequency.value = 880; gAigu.gain.value = 0;
            aigu.connect(gAigu); gAigu.connect(ctx.destination); aigu.start();
            var t0 = ctx.currentTime;
            for (var i = 0; i < 16; i++) {
                gAigu.gain.setValueAtTime(0.1, t0 + i * 0.5);
                gAigu.gain.setValueAtTime(0.0, t0 + i * 0.5 + 0.18);
            }
        }
        if (ctx.state === "suspended" && ctx.resume) ctx.resume();
    } catch (e) { rapport("audio du web", "ERREUR " + e); }
}

var A = new Audio("a.wav"), B = new Audio("b.wav");
A.loop = true; B.loop = true;
var refus = "";
function jouer(el, nom) {
    try {
        var p = el.play();
        if (p && p.then) p.then(null, function (e) { refus = nom; rapport(nom, "REFUSÉE : " + e); });
    } catch (e) { rapport(nom, "ERREUR " + e); }
}
A.onerror = function () { rapport("fichier A", "erreur de chargement"); };
B.onerror = function () { rapport("fichier B", "erreur de chargement"); };

var t = 0, avA = 0, avB = 0, ensemble = 0, v1 = [], v2 = [], web = 0;
function moyenne(l) { var s = 0; for (var i = 0; i < l.length; i++) s += l[i]; return l.length ? Math.round(100 * s / l.length) : 0; }
function etape() {
    t++;
    var pa = A.currentTime, pb = B.currentTime;
    var da = pa - avA, db = pb - avB;
    if (da < -1) da += 8; if (db < -1) db += 8;
    avA = pa; avB = pb;
    if (t === 1) { consigne.textContent = "ÉTAPE A — un son grave continu ET des bips aigus en même temps ?"; sonsFabriques(); }
    if (t === 9) {
        web = !ctx ? 0 : (ctx.state === "running" && ctx.currentTime > 5 ? 1 : 2);
        rapport("audio du web", ctx ? ctx.state + ", horloge " + ctx.currentTime.toFixed(1) + " s" : "ABSENT");
        if (gGrave) { gGrave.gain.value = 0; gAigu.gain.cancelScheduledValues(0); gAigu.gain.value = 0; }
        consigne.textContent = "ÉTAPE B — une basse ET une petite mélodie en même temps ?";
        jouer(A, "fichier A"); jouer(B, "fichier B");
    }
    if (t > 10 && t <= 17 && da > 0.5 && db > 0.5) ensemble++;
    if (t === 17) {
        rapport("deux fichiers à la fois", ensemble + " s sur 7");
        consigne.textContent = "ÉTAPE C — la basse s'efface peu à peu, la mélodie reste";
    }
    if (t > 17 && t <= 23) A.volume = Math.max(0, 1 - (t - 17) / 5);
    if (t === 23) {
        A.volume = 1; B.volume = 0;
        consigne.textContent = "ÉTAPE D — la basse seule, plus rapide";
        A.playbackRate = 1.25;
    }
    if (t > 24 && t <= 29) v1.push(da);
    if (t === 29) { consigne.textContent = "ÉTAPE E — la basse, plus lente"; A.playbackRate = 0.8; }
    if (t > 30 && t <= 35) v2.push(da);
    if (t === 35) {
        A.pause(); B.pause();
        consigne.textContent = "Terminé. Recopiez ce code :";
        document.getElementById("code").textContent = "CODE " + web + "-" + ensemble + "-" + moyenne(v1) + "-" + moyenne(v2) + "-" + (mp3 ? mp3.charAt(0) : "n");
        rapport("vitesses", moyenne(v1) + " puis " + moyenne(v2) + " (125 puis 80 attendus)");
    }
}
setInterval(etape, 1000);
document.addEventListener("keydown", function (e) {
    rapport("touche", e.keyCode + " " + (e.key || ""));
    sonsFabriques();
    if (refus) { refus = ""; jouer(A, "fichier A"); jouer(B, "fichier B"); }
});
</script>
</body>
</html>
